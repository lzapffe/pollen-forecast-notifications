# Place in .github/workflows/pollen-alert.yml
name: Pollen alert

# "on" decides WHEN the workflow runs.
on:
  # Started every evening at 20:00 Oslo time by the central scheduler
  # (Google Apps Script), or by hand with the "Run workflow" button.
  workflow_dispatch:

jobs:
  pollen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr2
            any::dplyr
            any::purrr
            any::tidyr
            any::lubridate
            any::glue
            any::stringr
            any::tibble

      - name: Check pollen and notify
        run: Rscript pollen_alert.R
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          NAAF_API_KEY:      ${{ secrets.NAAF_API_KEY }}
          NAAF_API_URL:      ${{ secrets.NAAF_API_URL }}
          GOOGLE_POLLEN_KEY: ${{ secrets.GOOGLE_POLLEN_KEY }}
          FORCE_RUN:         ${{ github.event_name == 'workflow_dispatch' }}
